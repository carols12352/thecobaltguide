name: Feature request
description: Propose a focused product or maintenance improvement
title: "[Feature]: "
labels:
  - enhancement
  - pending review
body:
  - type: markdown
    attributes:
      value: Thank you for proposing an improvement. Explain the user problem before prescribing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who is affected, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows or smaller approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups or references without including personal or confidential data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request does not contain personal or confidential data.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
