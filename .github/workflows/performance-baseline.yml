name: Performance baseline

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target_url:
        description: Public base URL to measure
        required: true
        type: string
      samples:
        description: Samples per API path (5-100)
        required: false
        default: "20"
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: performance-baseline-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  baseline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/performance ') ||
        startsWith(github.event.comment.body, '/performance-baseline ')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted baseline tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve request
        id: request
        run: node scripts/resolve-baseline-request.mjs --github-output "$GITHUB_OUTPUT"

      - name: Reply that performance baseline started
        if: ${{ github.event_name == 'issue_comment' && steps.request.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          BASELINE_URL: ${{ steps.request.outputs.base_url }}
          BASELINE_SAMPLES: ${{ steps.request.outputs.samples }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Performance baseline started ⏱️',
              '',
              `Target: ${process.env.BASELINE_URL}`,
              `Samples per API path: ${process.env.BASELINE_SAMPLES}`,
              '',
              `[Follow the workflow run](${runUrl})`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Install dependencies
        run: npm ci

      - name: Measure API baseline
        id: baseline
        env:
          BASELINE_BASE_URL: ${{ steps.request.outputs.base_url }}
          BASELINE_SAMPLES: ${{ steps.request.outputs.samples }}
          BASELINE_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          BASELINE_VERCEL_HOST_PREFIX: thecobaltguide-
          BASELINE_VERCEL_HOST_SUFFIX: -sichengs-projects-7a455dbc.vercel.app
        shell: bash
        run: |
          set -o pipefail
          node scripts/measure-api-baseline.mjs | tee performance-baseline.jsonl

      - name: Write job summary
        if: ${{ always() }}
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BASELINE_URL: ${{ steps.request.outputs.base_url }}
        run: node scripts/report-performance-baseline.mjs --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Reply with performance baseline result
        if: ${{ always() && github.event_name == 'issue_comment' && steps.request.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BASELINE_URL: ${{ steps.request.outputs.base_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { execFileSync } = require('node:child_process');
            const body = execFileSync(
              'node',
              ['scripts/report-performance-baseline.mjs'],
              { encoding: 'utf8', env: process.env },
            );
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload baseline result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-baseline-${{ github.run_id }}
          path: performance-baseline.jsonl
          if-no-files-found: ignore
          retention-days: 14
