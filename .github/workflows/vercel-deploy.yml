name: Vercel Preview on request

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: vercel-preview-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Resolve trusted PR head
        id: pull
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pull.state !== 'open') {
              core.setFailed('Preview deployments can only be requested for an open PR.');
              return;
            }

            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (pull.head.repo?.full_name !== expectedRepository) {
              core.setFailed('Preview deployments are restricted to branches in this repository.');
              return;
            }

            core.setOutput('sha', pull.head.sha);
            core.setOutput('head_label', pull.head.label);

      - name: Reply that preview deployment started
        id: notice
        uses: actions/github-script@v9
        env:
          PR_HEAD_LABEL: ${{ steps.pull.outputs.head_label }}
          PR_HEAD_SHA: ${{ steps.pull.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Preview deployment started 🚀',
              '',
              `Branch: \`${process.env.PR_HEAD_LABEL}\``,
              `Commit: \`${process.env.PR_HEAD_SHA.slice(0, 7)}\``,
              `Requested by: @${context.actor}`,
              '',
              `[Follow the workflow run](${runUrl})`,
            ].join('\n');
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.setOutput('comment_id', comment.id);

      - name: Check out requested PR commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pull.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as GitHub secrets."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@56.2.0

      - name: Deploy requested PR preview
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --yes --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "[$deployment_url]($deployment_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR with deployment result
        if: ${{ always() && steps.notice.outputs.comment_id }}
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          PR_HEAD_LABEL: ${{ steps.pull.outputs.head_label }}
          PR_HEAD_SHA: ${{ steps.pull.outputs.sha }}
          START_COMMENT_ID: ${{ steps.notice.outputs.comment_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const succeeded = process.env.DEPLOYMENT_OUTCOME === 'success';
            const body = succeeded
              ? [
                  '## Preview deployment ready ✅',
                  '',
                  `Preview: ${process.env.DEPLOYMENT_URL}`,
                  `Branch: \`${process.env.PR_HEAD_LABEL}\``,
                  `Commit: \`${process.env.PR_HEAD_SHA.slice(0, 7)}\``,
                  '',
                  `[View the workflow run](${runUrl})`,
                ].join('\n')
              : [
                  '## Preview deployment failed ❌',
                  '',
                  `Branch: \`${process.env.PR_HEAD_LABEL}\``,
                  `Commit: \`${process.env.PR_HEAD_SHA.slice(0, 7)}\``,
                  '',
                  `[Inspect the workflow run](${runUrl})`,
                ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.START_COMMENT_ID),
              body,
            });
