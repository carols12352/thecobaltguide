# For more information: https://supabase.com/docs/guides/cli/config
project_id = "thecobaltguide"

[api]
enabled = true
port = 54321
schemas = ["public", "extensions"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.email]
enable_signup = true

[auth.email.template.confirmation]
subject = "Confirm your Cobalt Merchant Map account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your Cobalt Merchant Map sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your Cobalt Merchant Map password"
content_path = "./supabase/templates/recovery.html"
